[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# A leaked resource (unclosed session/DB) or a forgotten await fails the build.
# Add a targeted "ignore:..." line here if a dependency's own warning ever trips this.
filterwarnings =
    error::ResourceWarning
    error::RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
    # discord.py's own code on Python 3.14+; nothing we can fix here
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
