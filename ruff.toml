# Ruff config: https://docs.astral.sh/ruff/configuration/
target-version = "py310"  # README: Python 3.10+
line-length = 100
extend-exclude = ["profiles"]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific
]
ignore = [
    "E501",   # line length is left to `ruff format`; long strings/SQL are fine
    "RUF001", # the en dash in score lines ("2–1") is intentional
]

[lint.isort]
known-first-party = ["bober"]
